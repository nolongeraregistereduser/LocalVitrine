services:
  mysql:
    image: mysql:8.4
    container_name: localvitrine-mysql
    environment:
      MYSQL_DATABASE: localvitrine
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: localvitrine-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/localvitrine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AI_BLAZE_API_KEY: ${BLAZE_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: localvitrine-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql_data:
