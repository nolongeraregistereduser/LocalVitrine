name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest stable Java version
        id: java
        run: |
          VERSION="$(curl -fsSL https://api.adoptium.net/v3/info/available_releases | jq -r '.most_recent_feature_release')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          check-latest: true
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (latest stable LTS)
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true

      - name: Restore node_modules cache
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ steps.node.outputs.node-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --prefer-offline

      - name: Build
        run: npm run build -- --configuration production

      - name: Test (headless)
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Lint (if available)
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint?0:1)"; then
            npm run lint
          fi
