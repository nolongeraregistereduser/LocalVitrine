<div class="editor-page lv-container">
  <header class="editor-topbar">
    <a [routerLink]="['/projects', projectId]" class="back-link">Back</a>
    <div class="editor-actions">
      <span *ngIf="saving" class="saving-state">Saving...</span>
      <span *ngIf="saveMessage" class="saved-state">{{ saveMessage }}</span>
      <button type="button" class="save-btn" (click)="saveManual()" [disabled]="saving || loading">Save</button>
    </div>
  </header>

  <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>
  <p *ngIf="loading" class="loading-msg">Loading editor...</p>

  <section class="editor-shell" [class.hidden]="loading">
    <div #editorHost id="gjs"></div>
  </section>
</div>
