<div class="editor-page">
  <header class="editor-topbar">
    <a [routerLink]="['/projects', projectId]" class="back-link">Retour au projet</a>
    <div class="editor-actions">
      <span *ngIf="hasPendingChanges && !saving" class="saving-state">Modifications non sauvegardees</span>
      <span *ngIf="saving" class="saving-state">Saving...</span>
      <span *ngIf="saveMessage" class="saved-state">{{ saveMessage }}</span>
      <button type="button" class="save-btn" (click)="saveManual()" [disabled]="saving || loading">Enregistrer</button>
      <a [routerLink]="['/projects', projectId, 'setup', 'publish']" class="flow-link">Continue</a>
    </div>
  </header>

  <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>
  <p *ngIf="loading" class="loading-msg">Chargement de l'editeur...</p>

  <section class="editor-shell" [class.hidden]="loading">
    <div #editorHost id="gjs"></div>
  </section>
</div>
